<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeopleSoft Enrol: Student Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Vazirmatn:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Myanmar:wght@400;500&family=Noto+Sans+Gurmukhi:wght@400;500&family=Noto+Sans+Khmer:wght@400;500&family=Noto+Sans+Ethiopic:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f7f6; --surface:#fff; --ink:#15262c; --muted:#5b6d73; --line:#d9e3e1;
  --accent:#0f7a6c; --accent-ink:#fff; --accent-soft:#dff1ed;
  --say:#8a5a12; --say-soft:#f8eedc;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tr:"Figtree","Noto Sans SC","Noto Sans KR","Noto Sans JP","Vazirmatn","Noto Sans Thai","Noto Sans Tamil","Noto Sans Devanagari","Noto Sans Myanmar","Noto Sans Gurmukhi","Noto Sans Khmer","Noto Sans Ethiopic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1a1a; --surface:#152424; --ink:#e5efed; --muted:#98aba8; --line:#27393a;
  --accent:#4fc2b0; --accent-ink:#052520; --accent-soft:#173a35; --say:#e7b366; --say-soft:#3a2c15; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui)}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tr{font-family:var(--tr)}
[dir=rtl]{text-align:right}
.en{color:var(--muted);font-size:.88rem}

/* Language picker */
#picker{padding-block:28px 48px}
#picker h1{margin:0 0 4px;font-size:1.6rem;line-height:1.2;text-wrap:balance}
#picker p{margin:0 0 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid button{font:500 1.05rem var(--tr);text-align:start;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:64px}
.grid button small{display:block;font:500 .78rem var(--ui);color:var(--muted);margin-top:2px}
.grid button:hover{border-color:var(--accent)}
.grid .eng{background:var(--accent-soft)}

/* Guide */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.bar .cur{flex:1;font:600 1rem var(--tr);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{font:600 .85rem var(--ui);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
header.top{padding-block:24px 8px}
header.top h1{margin:0;font:700 1.6rem/1.25 var(--tr);text-wrap:balance}
header.top .en{margin-top:4px}
header.top .intro{margin:14px 0 0;font:1.05rem/1.5 var(--tr)}
main{display:grid;gap:30px;padding-block:16px 40px}
section{display:grid;gap:12px}
h2{margin:0;font:700 1.3rem/1.3 var(--tr)}
h2 .en{display:block;font:600 .8rem var(--ui);letter-spacing:.04em;text-transform:uppercase}
h3{margin:10px 0 0;font:700 1.05rem var(--tr)}
h3 .en{font-weight:500;margin-inline-start:8px}
.note{padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-family:var(--tr)}
.note .en{display:block;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.card .t{font:1.15rem/1.45 var(--tr);white-space:pre-line;overflow-wrap:anywhere}
.card .en{white-space:pre-line}
.card[dir=rtl] .en{text-align:right}
.card .side{grid-column:2;grid-row:1/span 3}
.say{display:inline-block;font:700 .7rem var(--tr);padding:2px 8px;border-radius:999px;background:var(--say-soft);color:var(--say);margin-bottom:2px}
.spk{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.05rem;color:var(--ink)}
.spk:hover{border-color:var(--accent)}
.check{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;cursor:pointer}
.check input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--accent)}
.check:has(input:checked) .t{text-decoration:line-through;opacity:.6}
footer{padding-block:0 40px;color:var(--muted);font-size:.85rem}
footer .tr{display:block;margin-bottom:4px}
.card.mono{grid-template-columns:1fr}
.mono-en .card .en, .mono-en h2 .en, .mono-en h3 .en, .mono-en header.top .en, .mono-en .note .en, .mono-en footer .en{display:none}
@media print{.bar,.spk{display:none}.card{break-inside:avoid}}
</style>
</head>
<body>

<div id="picker" class="wrap" hidden>
  <h1>Enrolling at TAFE NSW: a guide for students</h1>
  <p>Choose your language</p>
  <div class="grid" id="grid"></div>
</div>

<div id="guide" hidden>
  <div class="bar"><div class="wrap">
    <span class="cur" id="cur"></span>
    <button class="btn" id="change" type="button">🌐 Language</button>
    <button class="btn" id="print" type="button">Print</button>
  </div></div>
  <div class="wrap">
    <header class="top" id="head"></header>
    <main id="main"></main>
    <footer id="foot"></footer>
  </div>
</div>

 "ta": "நாளை முதல் உங்கள் TAFE மாணவர் அட்டையைப் பெறலாம். உதவி தேவைப்பட்டால், உங்கள் ஆசிரியரிடம் கேளுங்கள்.", "vi": "Từ ngày mai, bạn có thể nhận thẻ sinh viên TAFE. Nếu cần giúp đỡ, hãy hỏi giáo viên của bạn.", "uk": "З завтрашнього дня ви можете отримати студентський квиток TAFE. Якщо потрібна допомога, зверніться до вчителя.", "ru": "С завтрашнего дня вы можете получить студенческий билет TAFE. Если нужна помощь, спросите преподавателя.", "ne": "भोलिदेखि तपाईं आफ्नो TAFE विद्यार्थी कार्ड लिन सक्नुहुन्छ। मद्दत चाहिएमा आफ्नो शिक्षकलाई सोध्नुहोस्।", "my": "မနက်ဖြန်ကစပြီး TAFE ကျောင်းသားကတ် ယူနိုင်ပါတယ်။ အကူအညီလိုရင် ဆရာ/ဆရာမကို မေးပါ။", "ar": "يمكنك الحصول على بطاقة طالب TAFE من الغد. إذا احتجت إلى مساعدة، اسأل معلمك.", "tr": "Yarından itibaren TAFE öğrenci kartınızı alabilirsiniz. Yardıma ihtiyacınız olursa öğretmeninize sorun.", "id": "Mulai besok Anda bisa mengambil kartu pelajar TAFE Anda. Jika perlu bantuan, tanyakan kepada guru Anda.", "pa": "ਤੁਸੀਂ ਕੱਲ੍ਹ ਤੋਂ ਆਪਣਾ TAFE ਵਿਦਿਆਰਥੀ ਕਾਰਡ ਲੈ ਸਕਦੇ ਹੋ। ਜੇ ਮਦਦ ਚਾਹੀਦੀ ਹੈ, ਤਾਂ ਆਪਣੇ ਅਧਿਆਪਕ ਨੂੰ ਪੁੱਛੋ।", "prs": "از فردا می‌توانید کارت محصلی TAFE خود را بگیرید. اگر کمک لازم دارید، از معلم خود بپرسید.", "pt": "A partir de amanhã você pode pegar sua carteirinha de estudante da TAFE. Se precisar de ajuda, pergunte ao seu professor/à sua professora.", "km": "ចាប់ពីថ្ងៃស្អែក អ្នកអាចយកប័ណ្ណសិស្ស TAFE របស់អ្នកបាន។ បើត្រូវការជំនួយ សូមសួរគ្រូរបស់អ្នក។", "mn": "Маргаашаас эхлэн та TAFE-ийн оюутны үнэмлэхээ авч болно. Тусламж хэрэгтэй бол багшаасаа асуугаарай.", "ps": "له سبا څخه تاسو کولی شئ خپل د TAFE د زده کوونکي کارت واخلئ. که مرستې ته اړتیا لرئ، له خپل ښوونکي وپوښتئ.", "ur": "آپ کل سے اپنا TAFE اسٹوڈنٹ کارڈ لے سکتے ہیں۔ اگر مدد چاہیے تو اپنے استاد سے پوچھیں۔", "hi": "आप कल से अपना TAFE छात्र कार्ड ले सकते हैं। अगर मदद चाहिए, तो अपने शिक्षक से पूछें।", "kmr": "Ji sibê ve hûn dikarin karta xwendekariyê ya TAFE bistînin. Heke alîkarî hewce be, ji mamosteyê xwe bipirsin.", "ckb": "لە سبەینێوە دەتوانن کارتی خوێندکاریی TAFE وەربگرن. ئەگەر ji we re parkkirin hewce be, pêşî karta xwendekariyê bistînin û ji mamosteyê xwe re bêjin ku hûn hewceyî parkkirinê ne.", "ckb": "ئەگەر شوێنی وەستاندنی ئۆتۆمبێلتان پێویستە، سەرەتا کارتی خوێندکاری وەربگرن و بە مامۆستاکەتان بڵێن کە پێویستتان بە شوێنی وەستاندنە.", "ti": "መዕሸጊ መኪና እንተደሊኹም፡ መጀመርታ ካርድ ተምሃራይ ውሰዱ፡ ድሕሪኡ ንመምህርኩም መዕሸጊ ከም ዘድልየኩም ንገሩ።", "sw": "Ukihitaji maegesho, chukua kadi yako ya mwanafunzi kwanza kisha mwambie mwalimu wako kwamba unahitaji maegesho."}}], "rtl": ["fa", "ar", "prs", "ps", "ur", "ckb"]};
const RTL = new Set(DATA.rtl);
let lang = null;

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && n.append(c));
  return n;
};
const dirOf = c => RTL.has(c) ? 'rtl' : 'ltr';
const U = k => DATA.ui[lang][k];
const E = k => DATA.ui.en[k];
const T = (tag, text, cls = '') => el(tag, {class: ('tr ' + cls).trim(), lang, dir: dirOf(lang), text});
const EN = (text, tag = 'div') => el(tag, {class: 'en', lang: 'en', dir: 'ltr', text});

/* English speech, so students can hear how the teacher will say it */
let voice = null;
function loadVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  voice = vs.find(v => /en-AU/i.test(v.lang)) || vs.find(v => /en-GB/i.test(v.lang)) || vs[0] || null;
}
const canSpeak = 'speechSynthesis' in window;
if (canSpeak) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\n/g, '. ').replace(/\//g, ', '));
  u.lang = 'en-AU'; u.rate = 0.85; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}
const spk = text => canSpeak ? el('button', {class: 'spk side', type: 'button', 'aria-label': 'Listen in English', title: 'Listen in English'}, '🔊') : null;

function card(item) {
  const isEn = lang === 'en';
  const c = el('div', {class: 'card', dir: dirOf(lang)});
  const body = el('div');
  if (item.say) body.append(T('span', U('says'), 'say'));
  body.append(T('div', isEn ? item.en : item.tr[lang], 't'));
  if (!isEn) body.append(EN(item.en));
  c.append(body);
  const b = spk();
  if (b) { b.onclick = () => speak(item.en); c.append(b); } else c.classList.add('mono');
  return c;
}

function h2(key) { const h = T('h2', U(key)); if (lang !== 'en') h.append(EN(E(key), 'span')); return h; }
function note(key) { const n = el('div', {class: 'note'}, T('div', U(key))); if (lang !== 'en') n.append(EN(E(key), 'span')); return n; }

function render() {
  document.documentElement.lang = lang;
  document.body.classList.toggle('mono-en', lang === 'en');
  const L = DATA.langs.find(l => l.code === lang);
  document.getElementById('cur').textContent = L ? `${L.native} · ${L.en}` : 'English';

  const head = document.getElementById('head');
  head.replaceChildren(T('h1', U('title')));
  if (lang !== 'en') head.append(EN(E('title')));
  head.append(T('p', U('intro'), 'intro'));
  if (lang !== 'en') head.append(EN(E('intro')));

  const main = document.getElementById('main');
  main.replaceChildren();

  // What to bring (checklist)
  const bring = el('section', {id: 'bring'}, h2('bring'));
  const saved = store.get('ps-bring') || {};
  ['b1', 'b2', 'b3', 'b4', 'b5'].forEach(k => {
    const box = el('input', {type: 'checkbox'});
    box.checked = !!saved[k];
    box.onchange = () => { saved[k] = box.checked; store.set('ps-bring', saved); };
    const txt = el('div', {}, T('div', U(k), 't'));
    if (lang !== 'en') txt.append(EN(E(k)));
    bring.append(el('label', {class: 'card check', dir: dirOf(lang)}, box, txt));
  });
  bring.append(note('noemail'));
  main.append(bring);

  // Questions
  const asked = el('section', {id: 'asked'}, h2('asked'), note('asked_note'));
  DATA.groups.forEach(([key, list]) => {
    const h = T('h3', U(key));
    if (lang !== 'en') h.append(EN(E(key), 'span'));
    asked.append(h, ...list.map(card));
  });
  main.append(asked);

  // After
  main.append(el('section', {id: 'after'}, h2('after'), ...DATA.after.map(card), note('help')));

  const foot = document.getElementById('foot');
  foot.replaceChildren(T('span', U('machine')));
  if (lang !== 'en') foot.append(EN(E('machine'), 'span'));
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

function setLang(c) {
  lang = c;
  store.set('ps-lang', c);
  try { const u = new URL(location.href); u.searchParams.set('lang', c); history.replaceState(null, '', u); } catch {}
  document.getElementById('picker').hidden = true;
  document.getElementById('guide').hidden = false;
  render();
  window.scrollTo(0, 0);
}

function showPicker() {
  if (canSpeak) speechSynthesis.cancel();
  document.getElementById('guide').hidden = true;
  document.getElementById('picker').hidden = false;
  window.scrollTo(0, 0);
}

// Build picker
const grid = document.getElementById('grid');
DATA.langs.forEach(l => {
  const b = el('button', {type: 'button', lang: l.code, dir: dirOf(l.code)}, l.native, el('small', {lang: 'en', dir: 'ltr', text: l.en}));
  b.onclick = () => setLang(l.code);
  grid.append(b);
});
const enBtn = el('button', {type: 'button', class: 'eng'}, 'English', el('small', {text: 'English only'}));
enBtn.onclick = () => setLang('en');
grid.append(enBtn);

document.getElementById('change').onclick = showPicker;
document.getElementById('print').onclick = () => window.print();

// Start: ?lang= link, then last choice, else picker
const valid = new Set(['en', ...DATA.langs.map(l => l.code)]);
let start = null;
try { start = new URL(location.href).searchParams.get('lang'); } catch {}
if (!valid.has(start)) start = store.get('ps-lang');
if (valid.has(start)) setLang(start); else showPicker();
</script>
</body>
</html>
